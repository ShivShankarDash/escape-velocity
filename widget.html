<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Velocity widget</title>
<style>
:root { color-scheme: light; --ink:#1e1b4b; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background: linear-gradient(160deg, #e0f2fe, #dcfce7); padding:10px; font-size: clamp(12px, 3.6vw, 16px); }
a { color: inherit; text-decoration: none; }
.card { background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:12px 14px; height: calc(100% - 4px); display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.hole { font-family: "Arial Black", system-ui, sans-serif; font-size: 1.35em; }
.date { font-weight:700; color:#5b5f7a; font-size:.85em; }
.bar { height:12px; border:2px solid var(--ink); border-radius:8px; background:#f1f5f9; overflow:hidden; margin:8px 0; }
.fill { height:100%; background: repeating-linear-gradient(45deg,#22c55e,#22c55e 8px,#16a34a 8px,#16a34a 16px); }
ul { list-style:none; margin:0; padding:0; flex:1; overflow:hidden; }
li { display:flex; gap:8px; align-items:flex-start; padding:4px 0; border-bottom:1px dashed #e2e8f0; line-height:1.25; }
li:last-child { border-bottom:0; }
.ck { flex:none; width:1.15em; height:1.15em; border:2px solid var(--ink); border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.8em; margin-top:1px; }
.done .ck { background:#22c55e; color:#fff; }
.done .t { text-decoration: line-through; opacity:.55; }
.tr { font-size:.72em; font-weight:900; text-transform:uppercase; letter-spacing:.5px; color:#5b5f7a; }
.boss .tr { color:#b91c1c; }
.foot { display:flex; gap:10px; flex-wrap:wrap; font-size:.8em; font-weight:800; margin-top:8px; color:#334155; }
.pill { background:#facc15; border:2px solid var(--ink); border-radius:8px; padding:1px 7px; }
.msg { font-weight:700; line-height:1.5; }
</style>
</head>
<body>
<a id="open" href="./" target="_blank" rel="noopener"><div class="card" id="w"><div class="msg">Loading your round…</div></div></a>
<script>
(function(){
  var params = new URLSearchParams(location.search), gist = params.get("gist"), box = document.getElementById("w");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function key(d){ return "d" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()); }
  if (!gist) { box.innerHTML = '<div class="msg">Add <b>?gist=YOUR_GIST_ID</b> to this page\'s URL. You can copy the full widget link from the tracker\'s Save Slot tab.</div>'; return; }
  fetch("https://api.github.com/gists/" + encodeURIComponent(gist) + "?t=" + Date.now(), { headers: { "Accept": "application/vnd.github+json" } })
    .then(function(r){ if (!r.ok) throw new Error("GitHub said " + r.status); return r.json(); })
    .then(function(g){ var f = g.files && g.files["widget.json"]; if (!f) throw new Error("No widget data yet. Sync once from the tracker."); return f.truncated ? fetch(f.raw_url).then(function(r){ return r.text(); }) : f.content; })
    .then(function(txt){
      var W = JSON.parse(txt), now = new Date(), D = W.days[key(now)];
      if (!D) {
        var first = Object.keys(W.days).sort()[0];
        box.innerHTML = '<div class="hole">' + (key(now) < first ? "Tee off soon" : "Course complete") + '</div><div class="foot"><span class="pill">Lv ' + W.level + ' · ' + esc(W.title) + '</span><span>' + W.xp + ' XP</span></div>';
        return;
      }
      var html = '<div class="top"><div class="hole">Hole ' + D.hole + '</div><div class="date">' + esc(D.date) + ' · ' + esc(D.result) + '</div></div>' +
        '<div class="bar"><div class="fill" style="width:' + D.pct + '%"></div></div><ul>';
      D.quests.forEach(function(q){ html += '<li class="' + (q[2] ? "done" : "") + (q[4] ? " boss" : "") + '"><span class="ck">' + (q[2] ? "✓" : "") + '</span><span><div class="tr">' + esc(q[4] ? "BOSS · " + q[0] : q[0]) + ' · +' + q[3] + ' XP</div><div class="t">' + esc(q[1]) + '</div></span></li>'; });
      html += '</ul><div class="foot"><span class="pill">Lv ' + W.level + ' · ' + esc(W.title) + '</span><span>Streak ' + W.streak + 'd</span><span>Score ' + esc(W.score) + '</span>';
      if (W.nextBoss) { var days = Math.round((new Date(W.nextBoss.date + "T00:00:00") - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000); html += '<span>Boss: ' + esc(W.nextBoss.name) + (days > 0 ? " in " + days + "d" : (days === 0 ? " today" : " overdue")) + '</span>'; }
      box.innerHTML = html + '</div>';
    })
    .catch(function(e){ box.innerHTML = '<div class="msg">Could not load your save. ' + esc(e.message) + '</div>'; });
  setTimeout(function(){ location.reload(); }, 15 * 60 * 1000);
})();
</script>
</body>
</html>
